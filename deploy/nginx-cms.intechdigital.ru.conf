# Public reverse proxy for Payload CMS.
#
# 1. Create the DNS record: cms.intechdigital.ru -> 159.194.238.3
# 2. Save this file as /etc/nginx/sites-available/cms.intechdigital.ru
# 3. Enable it and obtain TLS certificate (see README).
#
# The CMS container deliberately listens only on 127.0.0.1:3200, so it is not
# exposed directly to the Internet and is reached only through nginx.
server {
    listen 80;
    listen [::]:80;
    server_name cms.intechdigital.ru;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
