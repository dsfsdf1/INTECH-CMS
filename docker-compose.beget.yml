services:
  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URI: postgresql://intech:${POSTGRES_PASSWORD}@db:5432/intech
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - media:/app/public/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: intech
      POSTGRES_USER: intech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intech -d intech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  media:
